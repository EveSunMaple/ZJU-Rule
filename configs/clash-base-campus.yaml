# ============================================================================
#  ZJU Rule · 校园网模式基础配置
# ============================================================================
#
#  这个文件和 clash-base.yaml 的区别只有一个：**DNS**。
#
#  在校园网里，浙大有一批域名（zju.edu.cn、cc98.org、zjusec.com 等）只有
#  校内 DNS 才解析得出来，而且会返回内网 IP。默认配置用的是公共 DNS，
#  解析这些域名要么失败、要么返回外网地址，于是「开了代理就上不了内网」。
#
#  这里把校内 DNS (10.10.0.21) 设为主要 DNS，并对浙大域名强制指定，
#  所以系统代理开着也能正常访问内网。
#
#  ⚠️ 10.10.0.21 只在校园网（宿舍 / 实验室 / ZJUWLAN）里可用。
#     如果放假回家、不在校园网内，请改用 clash-base.yaml。
#
#  想改端口 / 嗅探等其它设置，参考同目录的 clash-base.yaml，两边通用。
# ============================================================================

# ---------------------------- 端口 ------------------------------------------
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

# ---------------------------- 性能 ------------------------------------------
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

# ---------------------------- 域名嗅探 --------------------------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ---------------------------- DNS（本文件的核心）----------------------------
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053

  # 校园网里用 redir-host 比 fake-ip 稳：
  # Clash 会老老实实做真实的 DNS 解析，内网域名拿到内网 IP，直连就通了。
  # fake-ip 模式下列表外的内网域名容易被映射成假 IP，反而连不上。
  enhanced-mode: redir-host

  # 校内 DNS 放第一位。它在校园网内同时能解析校内和校外域名。
  # 第二、三个是公共 DNS，作为校内 DNS 挂掉时的备胎。
  nameserver:
    - 10.10.0.21
    - 223.5.5.5
    - 119.29.29.29

  # 浙大域名强制只用校内 DNS 解析。
  #
  # 这一步是关键：这些域名在校外 DNS 上要么查不到，要么返回一个外网 IP，
  # 而我们要的是校内地址。指定之后就不再走公共 DNS 了。
  nameserver-policy:
    "+.zju.edu.cn": [10.10.0.21]
    "zju.edu.cn": [10.10.0.21]
    "+.cc98.org": [10.10.0.21]
    "cc98.org": [10.10.0.21]
    "+.zjusec.com": [10.10.0.21]
    "zjusec.com": [10.10.0.21]

  # 解析代理节点自身域名时用校内 DNS，避免「解析节点域名又走代理」的死循环
  proxy-server-nameserver:
    - 10.10.0.21
    - 223.5.5.5

  # 本地/内网域名一律不做特殊处理，直接按系统方式解析
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.zju.edu.cn"
    - "+.cc98.org"
    - "+.zjusec.com"

  # 注意：校园网模式下**不要**配 fallback。
  # fallback 会对同一域名并发查公共 DNS，而内网域名在公共 DNS 上查不到，
  # 结果可能反而被采纳，导致内网访问失败。

# ---------------------------- 规则数据库 ------------------------------------
# 规则里的 GEOIP,CN 需要 GeoIP 数据库
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

tun:
  # 如果你用 TUN 模式（Clash Verge 的「Tun 模式」开关），下面这项很有用：
  # 让校内 IP 段不经过 TUN，直接走物理网卡。
  enable: false
  stack: system
  dns-hijack:
    - any:53
  route-exclude-address:
    - 10.0.0.0/8
    - 192.168.0.0/16
    - 172.16.0.0/12

experimental:
  ignore-resolve-fail: true

# ============================================================================
#  下面三个键由转换引擎自动生成，请不要手动编辑
# ============================================================================
